# ─────────────────────────────────────────────────────────────────────────────
#  YOUR TABLE: the only file you need to edit.
#
#  After editing:  npm run sync   (pulls names, sets, images and market prices from TCGplayer)
#  Then deploy:    npm run deploy
#
#  Each item needs a TCGplayer product link. Everything else is optional:
#    price:     your asking price. The site shows the HIGHER of this and the
#               TCGplayer market price. Leave it out to just use market.
#    lockPrice: true  → always show your price, ignore the market (e.g. damaged cards)
#    condition: NM, LP, MP, HP, DMG          (singles; default from `defaults`)
#    graded:    "PSA 10", "CGC 9.5", …       (shows a slab instead of a toploader)
#    trade:     true/false                   (shows the TRADE ✓ sticker)
#    qty:       how many you have
#    status:    available | pending | sold   (pending/sold get a sticker)
#    hide:      true → keep it in the file but take it off the table
#    notes:     shown when someone picks the card up
#    name / image: override what TCGplayer says
#
#  In the `bulk` list you can write just the link on its own line.
#
#  `wanted` is the BUYING sign. Each line is either plain text or a TCGplayer
#  link (pulls the name and picture). Add `note:` for "NM only", "paying 80%"…
#  Delete everything under it to take the sign down.
# ─────────────────────────────────────────────────────────────────────────────

